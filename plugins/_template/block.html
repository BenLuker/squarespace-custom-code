<!--
  Code Block plugin (in-place widget).
  Paste into a Squarespace *Code Block* where you want the widget to appear.

  - data-sqcc-plugin  : which plugin (must match PLUGIN in plugin.js)
  - every other data-* : an option the user can change right here in Squarespace

  Replace @v1.0.0 with the tag you want (@main while testing) and _template
  with your plugin name. Every data-* attribute is optional; omit one to use
  its default.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/BenLuker/squarespace-custom-code@v1.0.0/plugins/_template/plugin.css">

<div
  data-sqcc-plugin="_template"
  data-text="Hello world"
  data-color="#c9a227"
></div>

<script src="https://cdn.jsdelivr.net/gh/BenLuker/squarespace-custom-code@v1.0.0/plugins/_template/plugin.js" defer></script>
