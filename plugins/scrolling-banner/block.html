<!--
  scrolling-banner — Code Block snippet.

  Meant for a Squarespace PAGE, not a blog post: add it as the first Code
  Block in the first (full-width) Section on the page, with the page title
  hidden. That gets you edge-to-edge width and rendering behind a
  transparent/fixed site header for free, straight from Squarespace's own
  Section behavior — no extra setup in this snippet. (The nav-overlay effect
  also depends on your site's own header being set to transparent/fixed in
  Site Styles — that's a per-site prerequisite this plugin can't force.)

  1. Add a Gallery (Section or Block) with the images you want, anywhere on
     the page — it gets hidden once read. Give it an ID like #hero-strip if
     there's more than one gallery on the page; otherwise the plugin
     auto-detects the first one.
  2. Add a Code Block *where you want the banner to appear* and paste this.
  3. Point data-gallery at your gallery (skip it to auto-detect).

  Swiper (the carousel engine) is loaded automatically by scrolling-banner.js
  if it isn't already on the page — no extra tag needed here.

  Replace @v1.0.0 with the tag you want (@main while testing). Every data-*
  attribute below is optional except the plugin marker — omit one to use its
  default (defaults shown here).
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/BenLuker/squarespace-custom-code@v1.0.0/plugins/scrolling-banner/scrolling-banner.css">

<div
  data-sqcc-plugin="scrolling-banner"
  data-gallery="#hero-strip"
  data-height="200"
  data-gap="16"
  data-speed="60"
  data-direction="left"
  data-autoplay="true"
  data-loop="true"
  data-align="left"
  data-align-gap="24"
  data-controls="true"
  data-dots="false"
  data-drag="true"
  data-snap="true"
  data-pause-on-hover="true"
  data-resume-delay="2500"
  data-radius="8"
  data-fade-edges="false"
  data-full-bleed="true"
  aria-label="Featured images"
></div>

<script src="https://cdn.jsdelivr.net/gh/BenLuker/squarespace-custom-code@v1.0.0/plugins/scrolling-banner/scrolling-banner.js" defer></script>
